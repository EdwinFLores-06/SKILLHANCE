<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Portafolios - Skillhance</title>

    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/toast.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="Img/LOGO-PROVISIONAL.png" alt="Logo Skillhance" width="250">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="crear-perfil-autor.html">Perfil Autor</a></li>
            <li><a href="subir-portafolio.html">Subir Portafolio</a></li>
            <li><a href="miperfil.html">Mi Perfil</a></li>
        </ul>
    </nav>
</header>

<main class="portafolio-contenedor">

    <section class="portafolio-hero">
        <h1>Mis Portafolios</h1>
        <p>Aquí aparecerán los proyectos que has publicado como autor Premium.</p>
    </section>

    <section id="listaPortafolios" class="portfolio-grid">
        <p>Cargando portafolios...</p>
    </section>

</main>
<div id="toast" class="toast"></div>

<script src="config.js"></script>

<script>
const idUsuario = localStorage.getItem("id_usuario");

if (!idUsuario || idUsuario === "undefined") {
    window.location.href = "iniciosesion.html";
}

async function cargarPortafolios() {
    const respuesta = await fetch(`${API_URL}/misPortafolios/${idUsuario}`);
    const resultado = await respuesta.json();

    const lista = document.getElementById("listaPortafolios");

    if (resultado.ok && resultado.portafolios.length > 0) {
        lista.innerHTML = "";

        resultado.portafolios.forEach(portafolio => {
            lista.innerHTML += `
                <article class="portfolio-card">
                    <img src="${API_URL}/${portafolio.imagen}" alt="${portafolio.titulo}">
                    <h3>${portafolio.titulo}</h3>
                    <p>${portafolio.descripcion || "Sin descripción"}</p>
                </article>
            `;
        });
    } else {
        lista.innerHTML = "<p>Aún no has subido portafolios.</p>";
    }
}

cargarPortafolios();
</script>

</body>
</html>
