<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Autor - Skillhance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="Img/LOGO-PROVISIONAL.png" alt="Logo Skillhance" width="250">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="sobre-nosotros.html">Nosotros</a></li>
            <li><a href="explorar.html">Explorar</a></li>
            <li><a href="suscripciones.html">Suscripciones</a></li>
            <li><a href="index.html#contacto">Contactos</a></li>
            <li><a href="miperfil.html">Mi Perfil</a></li>
        </ul>
    </nav>
</header>

<main class="perfil-autor-contenedor">

    <section class="perfil-autor-header">
        <img id="bannerAutor" class="banner-autor" src="Img/Portafolio-industrial.webp" alt="Banner del autor">

        <div class="perfil-autor-info">
            <img id="fotoAutor" class="foto-autor-grande" src="Img/perfiles/default.png" alt="Foto del autor">

            <h1 id="nombreAutor">Cargando autor...</h1>
            <p id="rolAutor" class="autor-rol"></p>
            <p id="descripcionAutor"></p>

            <div class="autor-stats">
                <span id="categoriaAutor"></span>
                <span><i class="fa-solid fa-crown"></i> Autor Premium</span>
                <span id="totalPortafolios"></span>
            </div>

            <div class="autor-botones perfil-botones">
                <button class="btn-favorito" id="btnFavoritoAutor">
                    <i class="fa-regular fa-heart"></i> Guardar autor
                </button>

                <button class="btn-seguir" id="btnSeguirAutor">
                    <i class="fa-solid fa-user-plus"></i> Seguir autor
                </button>
            </div>
        </div>
    </section>

    <section class="portafolio-hero">
        <h2>Portafolios del Autor</h2>
        <p>Explora los proyectos publicados por este autor profesional.</p>
    </section>

    <section id="proyectosGrid" class="portfolio-grid">
        <p>Cargando portafolios...</p>
    </section>

</main>

<div id="imgModal" class="img-modal">
    <span id="closeImg" class="close-img">&times;</span>

    <div class="modal-wrapper">
        <img id="modalImg" src="" alt="">
    </div>
</div>

<script src="config.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const idAutor = params.get("id_autor");

const bannerAutor = document.getElementById("bannerAutor");
const fotoAutor = document.getElementById("fotoAutor");
const nombreAutor = document.getElementById("nombreAutor");
const rolAutor = document.getElementById("rolAutor");
const descripcionAutor = document.getElementById("descripcionAutor");
const categoriaAutor = document.getElementById("categoriaAutor");
const totalPortafolios = document.getElementById("totalPortafolios");
const proyectosGrid = document.getElementById("proyectosGrid");

const btnFavoritoAutor = document.getElementById("btnFavoritoAutor");
const btnSeguirAutor = document.getElementById("btnSeguirAutor");

const imgModal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImg");
const closeImg = document.getElementById("closeImg");

let autorActual = null;

if (!idAutor) {
    document.querySelector("main").innerHTML = `
        <section class="perfil-card">
            <h1>Autor no encontrado</h1>
            <p>No se recibió un autor válido.</p>
            <a href="explorar.html" class="btn-gestionar">Volver a explorar</a>
        </section>
    `;
}

async function cargarPerfilAutor() {
    try {
        const respuesta = await fetch(`${API_URL}/autor/${idAutor}`);
        const resultado = await respuesta.json();

        if (!resultado.ok || !resultado.autor) {
            document.querySelector("main").innerHTML = `
                <section class="perfil-card">
                    <h1>Autor no encontrado</h1>
                    <p>Este perfil no existe o fue eliminado.</p>
                    <a href="explorar.html" class="btn-gestionar">Volver a explorar</a>
                </section>
            `;
            return;
        }

        autorActual = resultado.autor;

        bannerAutor.src = autorActual.banner_autor
            ? `${API_URL}/${autorActual.banner_autor}`
            : "Img/Portafolio-industrial.webp";

        fotoAutor.src = autorActual.foto_autor
            ? `${API_URL}/${autorActual.foto_autor}`
            : "Img/perfiles/default.png";

        nombreAutor.textContent = autorActual.nombre_autor;
        rolAutor.textContent = autorActual.rol;
        descripcionAutor.textContent = autorActual.descripcion || "Autor profesional de Skillhance.";
        categoriaAutor.innerHTML = `<i class="fa-solid fa-layer-group"></i> ${autorActual.categoria}`;

        btnFavoritoAutor.onclick = () => {
            agregarFavorito(
                autorActual.nombre_autor,
                "Autor " + autorActual.categoria,
                autorActual.foto_autor || "Img/perfiles/default.png",
                "autor"
            );
        };

        btnSeguirAutor.onclick = () => {
            seguirAutor(autorActual.nombre_autor);
        };

        cargarPortafoliosAutor();

    } catch (error) {
        console.log("Error al cargar autor:", error);
    }
}

async function cargarPortafoliosAutor() {
    try {
        const respuesta = await fetch(`${API_URL}/portafoliosAutor/${idAutor}`);
        const resultado = await respuesta.json();

        if (resultado.ok && resultado.portafolios.length > 0) {
            proyectosGrid.innerHTML = "";
            totalPortafolios.innerHTML = `<i class="fa-solid fa-folder-open"></i> ${resultado.portafolios.length} portafolios`;

            resultado.portafolios.forEach(portafolio => {
                proyectosGrid.innerHTML += `
                    <article class="portfolio-card">
                        <img src="${API_URL}/${portafolio.imagen}" alt="${portafolio.titulo}">
                        <h3>${portafolio.titulo}</h3>
                        <p>${portafolio.descripcion || "Sin descripción"}</p>

                        <button class="btn-favorito"
                            onclick="agregarFavorito('${portafolio.titulo}', 'Portafolio ${autorActual.categoria}', '${portafolio.imagen}', 'portafolio')">
                            ♡ Agregar a favoritos
                        </button>
                    </article>
                `;
            });

        } else {
            totalPortafolios.innerHTML = `<i class="fa-solid fa-folder-open"></i> 0 portafolios`;
            proyectosGrid.innerHTML = "<p>Este autor aún no ha subido portafolios.</p>";
        }

    } catch (error) {
        console.log("Error al cargar portafolios:", error);
    }
}

async function agregarFavorito(titulo, categoria, imagen, tipo = "portafolio") {
    const idUsuario = localStorage.getItem("id_usuario");
    const usuario = localStorage.getItem("usuario");

    if (!idUsuario || !usuario || idUsuario === "undefined") {
        window.location.href = "iniciosesion.html";
        return;
    }

    const respuesta = await fetch(`${API_URL}/favoritos`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id_usuario: idUsuario,
            titulo,
            categoria,
            imagen,
            tipo
        })
    });

    const resultado = await respuesta.json();
    alert(resultado.mensaje);
}

function seguirAutor(nombre) {
    const idUsuario = localStorage.getItem("id_usuario");
    const usuario = localStorage.getItem("usuario");

    if (!idUsuario || !usuario || idUsuario === "undefined") {
        window.location.href = "iniciosesion.html";
        return;
    }

    alert("Ahora sigues a " + nombre);
}

document.addEventListener("click", (e) => {
    const card = e.target.closest(".portfolio-card");

    if (!card) return;

    if (e.target.closest("button")) return;

    const imagen = card.querySelector("img");

    if (!imagen) return;

    modalImg.src = imagen.src;
    imgModal.classList.add("show");
    document.body.style.overflow = "hidden";
});

closeImg.addEventListener("click", () => {
    imgModal.classList.remove("show");
    document.body.style.overflow = "auto";
});

imgModal.addEventListener("click", (e) => {
    if (e.target === imgModal) {
        imgModal.classList.remove("show");
        document.body.style.overflow = "auto";
    }
});

cargarPerfilAutor();
</script>

</body>
</html>
