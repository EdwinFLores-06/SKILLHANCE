document.addEventListener("click", (e) => {

    const card = e.target.closest(".portfolio-card");

    if (!card) return;

    const imagen = card.querySelector("img");

    if (!imagen) return;

    modalImg.src = imagen.src;

    imgModal.classList.add("show");

    document.body.style.overflow = "hidden";
});

/* Cerrar con X */

closeImg.addEventListener("click", () => {
    imgModal.classList.remove("show");
    document.body.style.overflow = "auto";
});

/* Cerrar haciendo click fuera */

imgModal.addEventListener("click", (e) => {

    if (e.target === imgModal) {

const params = new URLSearchParams(window.location.search);

const categoriaSeleccionada = params.get("categoria") || "industrial";
const autorSeleccionado = params.get("autor") || "rodrigo";

const autor = autores[categoriaSeleccionada]?.[autorSeleccionado];

if (!autor) {
    document.querySelector("main").innerHTML = `
        <section class="perfil-card">
            <h1>Autor no encontrado</h1>
            <p>El perfil que buscas no existe o fue movido.</p>
            <a class="btn-gestionar" href="explorar.html">Volver a explorar</a>
        </section>
    `;
} else {
    document.getElementById("bannerAutor").src = autor.banner;
    document.getElementById("fotoAutor").src = autor.foto;
    document.getElementById("nombreAutor").textContent = autor.nombre;
    document.getElementById("rolAutor").textContent = autor.rol;
    document.getElementById("descripcionAutor").textContent = autor.descripcion;
    document.getElementById("proyectosAutor").textContent = autor.proyectos;
    document.getElementById("favoritosAutor").textContent = autor.favoritos;
    document.getElementById("categoriaAutor").textContent = autor.categoria;

    document.getElementById("btnFavoritoAutor").addEventListener("click", () => {
        agregarFavorito(
            autor.nombre,
            "Autor " + autor.categoria,
            autor.foto,
            "autor"
        );
    });

    document.getElementById("btnSeguirAutor").addEventListener("click", () => {
        seguirAutor(autor.nombre);
    });

    autor.portafolios.forEach(proyecto => {
        proyectosGrid.innerHTML += `
            <article class="portfolio-card">
                <img src="${proyecto.imagen}" alt="${proyecto.titulo}">
                <h3>${proyecto.titulo}</h3>
                <p>${proyecto.descripcion}</p>

                <button class="btn-favorito"
                    onclick="agregarFavorito('${proyecto.titulo}', 'Portafolio ${autor.categoria}', '${proyecto.imagen}', 'portafolio')">
                    ♡ Agregar a favoritos
                </button>
            </article>
        `;
    });
}

async function agregarFavorito(titulo, categoria, imagen, tipo = "portafolio") {

    const idUsuario = localStorage.getItem("id_usuario");
    const usuario = localStorage.getItem("usuario");

    if (!idUsuario || !usuario || idUsuario === "undefined") {
        window.location.href = "iniciosesion.html";
        return;
    }

    const respuesta = await fetch(`${API_URL}/favoritos`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id_usuario: idUsuario,
            titulo,
            categoria,
            imagen,
            tipo
        })
    });

    const resultado = await respuesta.json();
    alert(resultado.mensaje);
}

function seguirAutor(nombreAutor) {
    const idUsuario = localStorage.getItem("id_usuario");
    const usuario = localStorage.getItem("usuario");

    if (!idUsuario || !usuario || idUsuario === "undefined") {
        window.location.href = "iniciosesion.html";
        return;
    }

    alert("Ahora sigues a " + nombreAutor);
}
