<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Cuenta - SKILLHANCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
    
</head>
<body>

<header>
    <div class="logo">
        <img src="Img/LOGO-PROVISIONAL.png" alt="Logo" width="50" height="50">
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="miperfil.html">Mi Perfil</a></li>
            <li><a href="#" id="cerrarSesion">Cerrar Sesión</a></li>
        </ul>
    </nav>
</header>

<main class="perfil-contenedor">

    <section class="perfil-card">
        <h1>Administrar Cuenta</h1>

        <form id="formPerfil">
            <label>Foto de perfil</label>
            <input type="file" id="fotoPerfilInput" accept="image/*">

            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre">

            <label>Correo</label>
            <input type="email" id="correo" placeholder="Tu correo">

            <label>Profesión</label>
            <input type="text" id="profesion" placeholder="Ejemplo: Diseñador gráfico">

            <label>Biografía</label>
            <textarea id="biografia" placeholder="Escribe algo sobre ti"></textarea>

            <button type="submit">Guardar Cambios</button>
        </form>
    </section>

    <section class="perfil-card">
        <h2>Cambiar Contraseña</h2>

        <form id="formPassword">
            <label>Contraseña actual</label>
            <input type="password" id="passwordActual" placeholder="Contraseña actual">

            <label>Nueva contraseña</label>
            <input type="password" id="passwordNueva" placeholder="Nueva contraseña">

            <label>Confirmar contraseña</label>
            <input type="password" id="passwordConfirmar" placeholder="Confirmar contraseña">

            <button type="submit">Actualizar Contraseña</button>
        </form>
    </section>

    <section class="perfil-card">
        <h2>Configuración</h2>

        <label>
            <input type="checkbox" checked>
            Recibir novedades por correo
        </label>

        <label>
            <input type="checkbox" checked>
            Mostrar perfil público
        </label>

        <label>
            <input type="checkbox">
            Recordar sesión
        </label>
    </section>

</main>


<div id="toast" class="toast"></div>

<script src="config.js"></script>

<script>
function mostrarToast(mensaje, tipo = "success") {
    const toast = document.getElementById("toast");
    toast.textContent = mensaje;
    toast.className = "toast show " + tipo;

    setTimeout(() => {
        toast.className = "toast";
    }, 2800);
}

const idUsuario = localStorage.getItem("id_usuario");
const usuario = localStorage.getItem("usuario");
const correo = localStorage.getItem("correo");

if (!idUsuario || !usuario) {
    window.location.href = "iniciosesion.html";
}

document.getElementById("nombre").value = usuario || "";
document.getElementById("correo").value = correo || "";

document.getElementById("formPerfil").addEventListener("submit", async (e) => {
    e.preventDefault();

    const profesion = document.getElementById("profesion").value;
    const biografia = document.getElementById("biografia").value;
    const archivoFoto = document.getElementById("fotoPerfilInput").files[0];

    const respuesta = await fetch(`${API_URL}/guardarPerfil`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            id_usuario: idUsuario,
            profesion: profesion,
            biografia: biografia
        })
    });

    const resultado = await respuesta.json();

    if (archivoFoto) {
        const formData = new FormData();
        formData.append("foto", archivoFoto);
        formData.append("id_usuario", idUsuario);

        const respuestaFoto = await fetch(`${API_URL}/subirFoto`, {
            method: "POST",
            body: formData
        });

        const resultadoFoto = await respuestaFoto.json();

        mostrarToast(resultado.mensaje + " / " + resultadoFoto.mensaje, "success");
    } else {
        mostrarToast(resultado.mensaje, resultado.ok ? "success" : "error");
    }
});

document.getElementById("formPassword").addEventListener("submit", (e) => {
    e.preventDefault();
    mostrarToast("Después conectaremos el cambio de contraseña con la base de datos.", "info");
});

document.getElementById("cerrarSesion").addEventListener("click", (e) => {
    e.preventDefault();

    localStorage.removeItem("id_usuario");
    localStorage.removeItem("usuario");
    localStorage.removeItem("correo");

    window.location.href = "index.html";
});
</script>

</body>
</html>
