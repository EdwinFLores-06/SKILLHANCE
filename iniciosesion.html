<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillhance - Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style2.css">

</head>
<body>
<div class="red">

    <div class="linea" style="width:260px; top:110px; left:100px; transform:rotate(18deg);"></div>

    <div class="linea" style="width:240px; top:220px; left:180px; transform:rotate(-25deg);"></div>

    <div class="linea" style="width:300px; bottom:180px; right:120px; transform:rotate(18deg);"></div>

    <div class="linea" style="width:240px; bottom:300px; right:250px; transform:rotate(-30deg);"></div>

    <div class="linea" style="width:200px; top:90px; right:170px; transform:rotate(42deg);"></div>

    <div class="linea" style="width:170px; bottom:110px; left:240px; transform:rotate(60deg);"></div>

    <div class="punto" style="top:100px;left:90px;"></div>

    <div class="punto" style="top:180px;left:350px;"></div>

    <div class="punto" style="top:60px;right:170px;"></div>

    <div class="punto" style="top:250px;right:360px;"></div>

    <div class="punto" style="bottom:140px;left:250px;"></div>

    <div class="punto" style="bottom:80px;right:120px;"></div>

</div>

<div class="contenedor">

    <div class="tabs">
        <button id="btnLogin" class="activo">Iniciar Sesión</button>
        <button id="btnRegistro">Registrarse</button>
    </div>

    <!-- LOGIN -->
    <div id="login" class="formulario">

        <h2>SKILLHANCE</h2>
        <p>Bienvenido de nuevo</p>

        <form id="formLogin">

            <input
                type="email"
                name="correo"
                placeholder="Correo Electrónico"
                required>

            <input
                type="password"
                name="contrasena"
                placeholder="Contraseña"
                required>

            <button type="submit">
                Iniciar Sesión
            </button>
            <p id="mensajeLogin" class="mensaje-error"></p>
        </form>

    </div>

    <!-- REGISTRO -->
    <div id="registro" class="formulario oculto">

        <h2>Crear Cuenta</h2>

        <form id="formRegistro">

            <input
                type="text"
                name="nombre"
                placeholder="Nombre Completo"
                required>

            <input
                type="email"
                name="correo"
                placeholder="Correo Electrónico"
                required>

            <input
                type="password"
                name="contrasena"
                placeholder="Contraseña"
                required>

            <input
                type="password"
                name="confirmar_contrasena"
                placeholder="Confirmar Contraseña"
                required>

            <button type="submit">
                Registrarse
            </button>
            <p id="mensajeRegistro" class="mensaje-error"></p>
        </form>

    </div>

</div>

<script src="JS/iniciosesion.js"></script>

</body>
</html>
