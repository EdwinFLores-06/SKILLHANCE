<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Perfil de Autor - Skillhance</title>

    <link rel="stylesheet" href="CSS/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="Img/LOGO-PROVISIONAL.png" alt="Logo Skillhance" width="250">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="miperfil.html">Mi Perfil</a></li>
            <li><a href="subir-portafolio.html">Subir Portafolio</a></li>
            <li><a href="mis-portafolios.html">Mis Portafolios</a></li>
        </ul>
    </nav>
</header>

<main class="perfil-contenedor">

    <section class="perfil-card">
        <h1>Crear Perfil Profesional</h1>
        <p>Este perfil será visible para otros usuarios dentro de Skillhance.</p>

        <form id="formAutor">
            <label>Nombre profesional</label>
            <input type="text" id="nombreAutor" placeholder="Ejemplo: Edwin Flores" required>

            <label>Categoría</label>
            <select id="categoria" required>
                <option value="">Selecciona una categoría</option>
                <option value="Industrial">Diseño Industrial</option>
                <option value="Diseño Gráfico">Diseño Gráfico</option>
                <option value="Moda">Moda</option>
                <option value="Arquitectónico">Arquitectónico</option>
            </select>

            <label>Rol profesional</label>
            <input type="text" id="rol" placeholder="Ejemplo: Diseñador Industrial" required>

            <label>Descripción</label>
            <textarea id="descripcion" placeholder="Describe tu experiencia o estilo creativo"></textarea>

            <label>Foto de autor</label>
            <input type="file" id="fotoAutor" accept="image/*">

            <label>Banner del perfil</label>
            <input type="file" id="bannerAutor" accept="image/*">

            <button type="submit">Crear Perfil de Autor</button>
        </form>
    </section>

</main>

<script src="config.js"></script>

<script>
const idUsuario = localStorage.getItem("id_usuario");

if (!idUsuario || idUsuario === "undefined") {
    window.location.href = "iniciosesion.html";
}

async function verificarPremium() {
    const respuesta = await fetch(`${API_URL}/suscripcion/${idUsuario}`);
    const resultado = await respuesta.json();

    if (
        !resultado.ok ||
        !resultado.suscripcion ||
        resultado.suscripcion.estado !== "Activa" ||
        resultado.suscripcion.plan !== "Premium"
    ) {
        alert("Solo los usuarios Premium pueden crear un perfil de autor.");
        window.location.href = "suscripciones.html";
    }
}

verificarPremium();

document.getElementById("formAutor").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData();

    formData.append("id_usuario", idUsuario);
    formData.append("nombre_autor", document.getElementById("nombreAutor").value);
    formData.append("categoria", document.getElementById("categoria").value);
    formData.append("rol", document.getElementById("rol").value);
    formData.append("descripcion", document.getElementById("descripcion").value);

    const foto = document.getElementById("fotoAutor").files[0];
    const banner = document.getElementById("bannerAutor").files[0];

    if (foto) formData.append("foto_autor", foto);
    if (banner) formData.append("banner_autor", banner);

    const respuesta = await fetch(`${API_URL}/crearPerfilAutor`, {
        method: "POST",
        body: formData
    });

    const resultado = await respuesta.json();
    alert(resultado.mensaje);

    if (resultado.ok) {
        window.location.href = "subir-portafolio.html";
    }
});
</script>

</body>
</html>
